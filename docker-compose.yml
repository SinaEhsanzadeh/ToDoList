services:
  # PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI App (with Poetry)
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/tododb
      MAX_NUMBER_OF_TASKS: 10
    depends_on:
      - db

volumes:
  postgres_data: